<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash - Ultimate HD List Hub</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #151820;
            --accent-color: #00f0ff;
            --accent-ill: #ff2a5f;
            --text-color: #ffffff;
            --text-muted: #8c92a4;
            --border-color: #232733;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

        header {
            text-align: center;
            padding: 25px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 25px;
        }
        header h1 { font-size: 2.4rem; color: var(--accent-color); text-transform: uppercase; letter-spacing: 3px; }

        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        nav button {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        nav button:hover, nav button.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .list-container { display: none; max-width: 950px; margin: 0 auto; }
        .list-container.active { display: block; }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.8rem;
            border-left: 5px solid var(--accent-color);
            padding-left: 12px;
        }
        .ill-title { border-left-color: var(--accent-ill); }

        .demon-card {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .demon-card:hover {
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        .rank {
            font-size: 1.3rem;
            font-weight: bold;
            width: 85px;
            text-align: center;
            color: var(--accent-color);
            flex-shrink: 0;
        }
        .ill-rank { color: var(--accent-ill); }

        .pixel-art-box {
            width: 170px;
            height: 95px;
            background-color: #07080a;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .pattern-cyan {
            background: linear-gradient(135deg, #00f0ff 25%, #0d1b2a 25%, #0d1b2a 50%, #00f0ff 50%, #00f0ff 75%, #0d1b2a 75%);
            background-size: 20px 20px;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .pattern-purple {
            background: linear-gradient(45deg, #8b00ff 25%, #18052d 25%, #18052d 50%, #8b00ff 50%, #8b00ff 75%, #18052d 75%);
            background-size: 24px 24px;
            box-shadow: inset 0 0 10px rgba(139, 0, 255, 0.4);
        }
        .pattern-red {
            background: linear-gradient(135deg, #ff2a5f 25%, #2b0d16 25%, #2b0d16 50%, #ff2a5f 50%, #ff2a5f 75%, #2b0d16 75%);
            background-size: 20px 20px;
            box-shadow: inset 0 0 10px rgba(255, 42, 95, 0.4);
        }
        .pattern-dark {
            background: linear-gradient(45deg, #232d4a 25%, #0f131c 25%, #0f131c 50%, #232d4a 50%, #232d4a 75%, #0f131c 75%);
            background-size: 16px 16px;
        }
        .pattern-yellow {
            background: linear-gradient(135deg, #ffd700 25%, #2b2505 25%, #2b2505 50%, #ffd700 50%, #ffd700 75%, #2b2505 75%);
            background-size: 20px 20px;
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.4);
        }
        .pattern-ill {
            background: linear-gradient(135deg, #ff003c 25%, #1f0007 25%, #1f0007 50%, #ff003c 50%, #ff003c 75%, #1f0007 75%);
            background-size: 16px 16px;
            box-shadow: inset 0 0 12px rgba(255, 0, 60, 0.6);
        }

        .demon-info { padding: 12px 18px; flex-grow: 1; }
        .demon-info h3 { font-size: 1.25rem; margin-bottom: 4px; }
        .demon-info p { color: var(--text-muted); font-size: 0.9rem; }

        .player-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 22px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .player-left { display: flex; align-items: center; gap: 18px; }
        .player-avatar-box {
            width: 45px; height: 45px; border-radius: 50%;
            background-color: #1f2330; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: var(--accent-color); border: 1px solid var(--accent-color);
            flex-shrink: 0; font-size: 0.95rem;
        }
        .player-points { font-weight: bold; color: var(--accent-color); font-size: 1.1rem; }
    </style>
</head>

    <script>
        function showTab(tabId) {
            const containers = document.querySelectorAll('.list-container');
            containers.forEach(c => c.classList.remove('active'));

            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }
